apis:
- aid: red-hat-enterprise-linux-8:cockpit-api
  name: RHEL 8 Cockpit Web Console API
  description: >-
    Cockpit is a web-based system management interface for RHEL that exposes internal D-Bus and system
    APIs through a WebSocket-based transport. The Cockpit API provides access to system configuration,
    storage management, network configuration, service management, user accounts, and system logs from
    a web browser. It operates locally on each managed system at port 9090.
  humanURL: https://cockpit-project.org/guide/latest/api-base1.html
  baseURL: https://localhost:9090/cockpit
  tags:
  - Management
  - System Administration
  - UI
  - Web Console
  properties:
  - type: Documentation
    url: https://cockpit-project.org/guide/latest/api-base1.html
  - type: GitHub
    url: https://github.com/cockpit-project/cockpit
  - type: Guide
    url: >-
      https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html/managing_systems_using_the_rhel_8_web_console/index
- aid: red-hat-enterprise-linux-8:system-roles-api
  name: RHEL 8 System Roles API
  description: >-
    RHEL System Roles are a collection of Ansible roles and modules for automating RHEL system configuration
    tasks including networking, storage, certificate management, SELinux, time sync, and firewall configuration.
    The roles expose a structured YAML-based API for declarative system state management through Ansible
    Automation Platform or standalone Ansible.
  humanURL: https://access.redhat.com/articles/3050101
  baseURL: https://console.redhat.com/ansible/automation-hub/
  tags:
  - Ansible
  - Automation
  - Configuration Management
  - System Roles
  properties:
